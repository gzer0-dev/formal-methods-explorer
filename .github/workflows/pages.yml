# main に push されたら、verify（型・層・lint・整形・テスト・ビルド・公開物の検査）を通してから GitHub Pages に出す。
# verify が落ちたら公開しない（壊れた説明を出さないため）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # サイトの数字が TLA+ の TLC と一致するかを照合する（specs/tla）。食い違ったら公開しない。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: TLA+ の道具（tla2tools.jar v1.7.4）を取得して照合
        run: |
          mkdir -p "$RUNNER_TEMP/tla"
          curl -sSL -o "$RUNNER_TEMP/tla/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla/tla2tools.jar" | sha256sum -c -
          JAVA=java TLA2TOOLS="$RUNNER_TEMP/tla/tla2tools.jar" npm run check:tla
      - name: Alloy（6.2.0）を取得して照合
        run: |
          mkdir -p "$RUNNER_TEMP/alloy"
          curl -sSL -o "$RUNNER_TEMP/alloy/alloy.jar" https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
          echo "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d  $RUNNER_TEMP/alloy/alloy.jar" | sha256sum -c -
          JAVA=java ALLOY_JAR="$RUNNER_TEMP/alloy/alloy.jar" npm run check:alloy
      - name: ProB（1.16.1）を取得して CSP を照合
        run: |
          mkdir -p "$RUNNER_TEMP/prob"
          curl -sSL -o "$RUNNER_TEMP/prob/ProB.tar.gz" https://stups.hhu-hosting.de/downloads/prob/tcltk/releases/1.16.1/ProB.linux64.tar.gz
          echo "e9f0c74a6bbf177c9146d01869afa1c4276f5fc8d3b670f31b0230f035753bef  $RUNNER_TEMP/prob/ProB.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/prob/ProB.tar.gz" -C "$RUNNER_TEMP/prob"
          PROBCLI="$RUNNER_TEMP/prob/ProB/probcli" JAVA_HOME_BIN="$JAVA_HOME/bin" npm run check:csp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
